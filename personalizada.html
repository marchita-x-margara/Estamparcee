<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalizadas</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="personalizada.css">

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas/dist/html2canvas.min.js"></script>

<script src="personalizada.js" defer></script>
</head>
<body>

<main class="editor">


    <aside class="panel">

        <h2>Personalizá tu remera</h2>

        <div class="grupo">

            <label>Talle</label>

            <select id="talle">
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
                <option>XXL</option>
            </select>

        </div>

        <div class="grupo">

            <label>Color</label>

            <select id="color">
    <option value="blanca">Blanca</option>
    <option value="negra">Negra</option>
    <option value="roja">Roja</option>
    <option value="azul">Azul</option>
    <option value="gris">Gris</option>
</select>

        </div>

        <div class="grupo">

 <div class="grupo">

    <label>Subir diseño</label>

    <input
        type="file"
        id="upload"
        accept=".png,.jpg,.jpeg"
        multiple>

</div>

<div class="grupo">
    <label>Precio</label>
    <p>$<span id="precio">20000</span></p>
</div>

</aside>


   <section class="preview">

    <div class="remera">

        <canvas id="shirtCanvas"></canvas>

        <div class="print-area">

            <div class="design-box" id="design-container">

            </div>

        </div>

    </div>



    <button id="agregarCarrito">
        Agregar al carrito
    </button>


</section>
<section class="imagen-derecha">

    <img src="pj_pagina.png" alt="Imagen decorativa">

</section>
</main>


<div id="carritoPanel">

    <button id="cerrarCarrito">
        ✕
    </button>

    <h2>
        🛒 Carrito
    </h2>

    <div id="listaCarrito"></div>


    <h3>
        Entrega:
    </h3>

    <select id="envio">

        <option value="encuentro">
            Encuentro coordinado
        </option>

        <option value="correo">
            Correo Argentino
        </option>

    </select>


    <h3>
        Total: $<span id="totalCarrito">0</span>
    </h3>


    <button id="comprar">
        Finalizar compra
    </button>

</div>


<button id="abrirCarrito">
    🛒 <span id="contadorCarrito">0</span>
</button>
</body>
</html>
